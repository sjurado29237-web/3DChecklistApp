<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL Parts Checklist</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#202124}
header{background:#202124;color:#fff;padding:20px}
h1{margin:0 0 4px;font-size:26px}
header p{margin:0;color:#ccc}
.wrap{max-width:1100px;margin:auto}
.drop{margin:18px 14px;padding:45px 20px;border:3px dashed #aaa;border-radius:16px;background:#fff;text-align:center;transition:.15s}
.drop.over{border-color:#333;background:#f0f0f0}
.drop strong{display:block;font-size:20px;margin-bottom:8px}
.drop span{color:#666}
button,input,select{font:inherit}
button{padding:10px 14px;border:1px solid #ccc;border-radius:9px;background:#fff;cursor:pointer}
.filebtn{margin-top:14px}
.controls{margin:14px;display:flex;gap:10px;flex-wrap:wrap}
.controls input{flex:1;min-width:180px;padding:10px;border:1px solid #ccc;border-radius:9px}
.controls select{padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}
.progress{margin:14px;background:#fff;padding:14px;border-radius:12px}
.bar{height:12px;background:#ddd;border-radius:20px;overflow:hidden;margin-top:8px}
.fill{height:100%;width:0;background:#4caf50;transition:.2s}
#count{font-size:14px;color:#666;margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 14px 30px}
.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 8px #0001}
.preview{height:170px;background:#eef0f2;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview canvas{width:100%;height:100%}
.fallback{font-size:48px;color:#777}
.name{font-weight:700;margin:12px 0 8px;word-break:break-word}
.have{display:flex;align-items:center;gap:9px;margin:9px 0}
.have input{width:20px;height:20px}
.open{display:block;text-align:center;text-decoration:none;margin:10px 0;padding:10px;border:1px solid #ccc;border-radius:8px;color:#202124;background:#f8f9fa}
.remove{width:100%;margin-top:8px}
.empty{text-align:center;color:#777;padding:35px 14px}
.small{font-size:12px;color:#777;margin-top:8px}
</style>
</head>
<body>
<header><div class="wrap">
<h1>STL Parts Checklist</h1>
<p>Drop STL files here. Each file becomes its own checklist entry.</p>
</div></header>

<main class="wrap">
<div class="drop" id="drop">
<strong>Drag & drop STL files here</strong>
<span>On iPad, use the button below to choose STL files from Files.</span><br>
<button class="filebtn" onclick="document.getElementById('picker').click()">Choose STL files</button>
<input id="picker" type="file" accept=".stl,model/stl,application/sla" multiple hidden>
</div>

<div class="controls">
<input id="search" placeholder="Search files..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">All</option>
<option value="missing">Missing</option>
<option value="have">Have</option>
</select>
<button onclick="clearAll()">Remove all</button>
</div>

<div class="progress">
<strong>Progress</strong>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="count">0 of 0</div>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty">No STL files yet. Add your first STL above.</div>
</main>

<script>
const files=[];
const state={};
const drop=document.getElementById("drop");
const picker=document.getElementById("picker");

picker.addEventListener("change",e=>addFiles([...e.target.files]));
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>addFiles([...e.dataTransfer.files]));

function addFiles(list){
  list.filter(f=>f.name.toLowerCase().endsWith(".stl")).forEach(file=>{
    const key=file.name+"_"+file.size+"_"+file.lastModified;
    if(files.some(x=>x.key===key)) return;
    files.push({file,key,url:URL.createObjectURL(file)});
    state[key]=state[key]||{have:false};
  });
  picker.value="";
  render();
}

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const filter=document.getElementById("filter").value;
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  let shown=0;

  files.forEach((item,i)=>{
    const s=state[item.key]||{have:false};
    if(!item.file.name.toLowerCase().includes(q)) return;
    if(filter==="have"&&!s.have) return;
    if(filter==="missing"&&s.have) return;
    shown++;

    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="preview"><div class="fallback">🧩</div></div>
      <div class="name">${esc(item.file.name)}</div>
      <label class="have">
        <input type="checkbox" ${s.have?"checked":""}>
        I have this part
      </label>
      <a class="open" href="https://inmoov.fr/inmoov-stl-parts-viewer/?bodyparts=BicepOlderVersion" target="_blank" rel="noopener">Open InMoov Parts Viewer</a>
      <button class="remove">Remove this file</button>
      <div class="small">${Math.round(item.file.size/1024)} KB</div>`;

    card.querySelector("input").onchange=e=>{
      state[item.key].have=e.target.checked;
      render();
    };
    card.querySelector(".remove").onclick=()=>{
      URL.revokeObjectURL(item.url);
      files.splice(i,1);
      delete state[item.key];
      render();
    };
    grid.appendChild(card);
  });

  document.getElementById("empty").style.display=files.length?"none":"block";
  updateProgress();
}

function updateProgress(){
  const total=files.length;
  const have=files.filter(x=>state[x.key]?.have).length;
  document.getElementById("fill").style.width=total?(have/total*100)+"%":"0%";
  document.getElementById("count").textContent=`${have} of ${total} parts marked as having`;
}
function clearAll(){
  if(!files.length)return;
  if(confirm("Remove all STL entries?")){
    files.forEach(x=>URL.revokeObjectURL(x.url));
    files.length=0;
    for(const k in state) delete state[k];
    render();
  }
}
function esc(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
render();
</script>
</body>
</html>
