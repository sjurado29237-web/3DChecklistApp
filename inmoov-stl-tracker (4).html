<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InMoov STL Parts Tracker</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#33d17a;
    --danger:#ff5c5c; --radius:10px;
  }
  *{box-sizing:border-box;}
  html, body{ overflow:hidden; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden;
  }
  /* Sidebar */
  #sidebar{
    width:280px; min-width:220px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #sidebar h1{
    font-size:16px; margin:0; padding:16px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  #sidebar h1 span.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;}
  #search{
    margin:12px; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:13px;
  }
  #catList{ overflow-y:auto; flex:1; min-height:0; padding:0 8px 8px; }
  .catItem{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; color:var(--muted);
    margin-bottom:2px;
  }
  .catItem:hover{ background:var(--panel2); color:var(--text); }
  .catItem.active{ background:var(--accent); color:#fff; }
  .catItem .count{ font-size:11px; opacity:.8; }
  .catItem.active .count{ opacity:1; }
  .catItem .catRight{ display:flex; align-items:center; gap:6px; }
  .catDelBtn{
    opacity:0; background:none; border:none; color:var(--danger); font-size:13px; padding:2px 5px;
    border-radius:5px; cursor:pointer; line-height:1;
  }
  .catItem:hover .catDelBtn{ opacity:.85; }
  .catDelBtn:hover{ opacity:1 !important; background:rgba(255,92,92,.15); }
  #newFolderRow{ display:flex; gap:6px; padding:0 12px 10px; }
  #newFolderRow input{
    flex:1; padding:7px 9px; border-radius:7px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:12.5px;
  }
  #globalStats{
    padding:12px 16px; border-top:1px solid var(--border); font-size:12px; color:var(--muted);
  }
  #globalStats b{ color:var(--text); }
  #globalBar{ height:6px; background:var(--panel2); border-radius:4px; margin-top:6px; overflow:hidden; }
  #globalBarFill{ height:100%; background:var(--accent2); width:0%; transition:width .3s; }
  .sideBtns{ display:flex; gap:6px; padding:0 16px 14px; }
  .sideBtns button{ flex:1; }

  /* Main */
  #main{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  #topbar{
    padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  #topbar .titleWrap h2{ margin:0; font-size:20px; }
  #topbar .titleWrap p{ margin:2px 0 0; font-size:12.5px; color:var(--muted); }
  #catProgress{ font-size:12.5px; color:var(--muted); min-width:150px; text-align:right; }
  #catBar{ height:6px; width:150px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-top:4px; }
  #catBarFill{ height:100%; background:var(--accent2); width:0%; transition:width .3s; }

  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:7px 12px; font-size:12.5px; cursor:pointer;
  }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover{ filter:brightness(1.1); }
  button.danger{ color:var(--danger); }

  #grid{
    flex:1; min-height:0; overflow-y:auto; padding:20px 22px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; align-content:start;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column; transition:border-color .15s;
    height:360px;
  }
  .card.printed{ border-color:var(--accent2); }
  .thumb{
    width:100%; height:180px; background:#fff;
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; flex-shrink:0;
  }
  .thumb img{ width:100%; height:100%; object-fit:contain; }
  .thumb .noimg{ color:var(--muted); font-size:11px; text-align:center; padding:10px; }
  .cardBody{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1; min-height:0; }
  .cardBody .name{
    font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0;
  }
  .cardBody textarea.desc{
    width:100%; resize:none; height:64px; flex-shrink:0; font-size:12px; background:var(--panel2);
    border:1px solid var(--border); border-radius:6px; color:var(--text); padding:6px; font-family:inherit;
    overflow-y:auto;
  }
  .cardFooter{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  .printedLabel{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; }
  .printedLabel input{ width:16px; height:16px; accent-color:var(--accent2); cursor:pointer; }
  .cardActions{ display:flex; gap:6px; }
  .cardActions button{ padding:4px 7px; font-size:11px; }

  .emptyState{ color:var(--muted); font-size:13.5px; padding:30px; text-align:center; grid-column:1/-1; }
  .emptyState code{ background:var(--panel2); padding:2px 6px; border-radius:4px; }

  /* Modal */
  .modalOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50;
  }
  .modalOverlay.show{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; width:380px; max-width:90vw;
    padding:20px; display:flex; flex-direction:column; gap:10px;
  }
  .modal h3{ margin:0 0 4px; font-size:15px; }
  .modal label{ font-size:12px; color:var(--muted); }
  .modal input[type=text], .modal textarea{
    width:100%; padding:8px 9px; border-radius:7px; border:1px solid var(--border); background:var(--panel2);
    color:var(--text); font-size:13px; font-family:inherit;
  }
  .modal textarea{ min-height:60px; resize:vertical; }
  .modalActions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  #fileInput{ display:none; }
  .hint{ font-size:11px; color:var(--muted); line-height:1.4; }
</style>
</head>
<body>

<div id="sidebar">
  <h1><span class="dot"></span> InMoov STL Tracker</h1>
  <input id="search" type="text" placeholder="Search categories...">
  <div id="newFolderRow">
    <input id="newFolderInput" type="text" placeholder="New folder name...">
    <button id="newFolderBtn" title="Create a new category folder">+ Folder</button>
  </div>
  <div id="catList"></div>
  <div id="globalStats">
    <div><b id="gPrinted">0</b>/<span id="gTotal">0</span> parts printed overall</div>
    <div id="globalBar"><div id="globalBarFill"></div></div>
  </div>
  <div class="sideBtns">
    <button id="exportBtn" title="Save your progress to a JSON file">Export</button>
    <button id="importBtn" title="Load a previously exported JSON file">Import</button>
    <input type="file" id="fileInput" accept="application/json">
  </div>
</div>

<div id="main">
  <div id="topbar">
    <div class="titleWrap">
      <h2 id="catTitle">Category</h2>
      <p id="catSub">0 parts</p>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <div id="catProgress">
        0 / 0 printed
        <div id="catBar"><div id="catBarFill"></div></div>
      </div>
      <button class="danger" id="deleteFolderBtn" title="Delete this whole folder and its parts">Delete Folder</button>
      <button class="primary" id="addPartBtn">+ Add Part</button>
    </div>
  </div>
  <div id="grid"></div>
</div>

<!-- Add/Edit Part Modal -->
<div class="modalOverlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Add Part</h3>
    <label>Part name</label>
    <input type="text" id="mName" placeholder="e.g. BackCoverTopLeftV3.stl">
    <label>Image URL (optional)</label>
    <input type="text" id="mImage" placeholder="https://inmoov.fr/wp-content/uploads/stl/Back/BackCoverTopLeftV3.png">
    <label>Description</label>
    <textarea id="mDesc" placeholder="What this part is / notes"></textarea>
    <div class="hint">
      Tip: on the InMoov site, image URLs follow this pattern:<br>
      <code>https://inmoov.fr/wp-content/uploads/stl/&lt;Category&gt;/&lt;PartName&gt;.png</code>
    </div>
    <div class="modalActions">
      <button id="mCancel">Cancel</button>
      <button class="primary" id="mSave">Save</button>
    </div>
  </div>
</div>

  return { name:file, image:imgUrl(cat,file), desc: desc || '', printed:false };

let currentCat = "Back";
let editingIndex = null; // when set, modal edits existing part instead of adding

/* ---------- Rendering ---------- */
function catTotals(cat){
  const list = DATA[cat] || [];
  const printed = list.filter(p=>p.printed).length;
  return {printed, total:list.length};
}

function renderSidebar(filter=""){
  const listEl = document.getElementById('catList');
  listEl.innerHTML = '';
  const f = filter.trim().toLowerCase();
  CATEGORY_NAMES.filter(c=>c.toLowerCase().includes(f)).forEach(cat=>{
    const {printed,total} = catTotals(cat);
    const div = document.createElement('div');
    div.className = 'catItem' + (cat===currentCat ? ' active':'');
    div.setAttribute('data-cat', cat);
    div.innerHTML = `<span class="catName">${cat}</span>
      <span class="catRight">
        <span class="count">${printed}/${total}</span>
        <button type="button" class="catDelBtn" data-cat="${cat}" title="Delete folder">✕</button>
      </span>`;
    listEl.appendChild(div);
  });
}

/* Event delegation for the sidebar: attached once, works no matter how often renderSidebar redraws it */
document.getElementById('catList').addEventListener('click', function(e){
  const delBtn = e.target.closest('.catDelBtn');
  if(delBtn){
    e.stopPropagation();
    deleteFolder(delBtn.getAttribute('data-cat'));
    return;
  }
  const row = e.target.closest('.catItem');
  if(row){
    currentCat = row.getAttribute('data-cat');
    renderAll();
  }
});

function renderTopbar(){
  document.getElementById('catTitle').textContent = currentCat || 'No folders';
  document.getElementById('addPartBtn').style.display = currentCat ? '' : 'none';
  document.getElementById('deleteFolderBtn').style.display = currentCat ? '' : 'none';
  if(!currentCat){
    document.getElementById('catSub').textContent = '';
    document.getElementById('catProgress').childNodes[0].textContent = '';
    document.getElementById('catBarFill').style.width = '0%';
    return;
  }
  const {printed,total} = catTotals(currentCat);
  document.getElementById('catSub').textContent = total + (total===1?' part':' parts');
  document.getElementById('catProgress').childNodes[0].textContent = `${printed} / ${total} printed `;
  const pct = total? Math.round(printed/total*100):0;
  document.getElementById('catBarFill').style.width = pct+'%';
}

function renderGlobalStats(){
  let printed=0,total=0;
  CATEGORY_NAMES.forEach(c=>{ const t=catTotals(c); printed+=t.printed; total+=t.total; });
  document.getElementById('gPrinted').textContent = printed;
  document.getElementById('gTotal').textContent = total;
  const pct = total? Math.round(printed/total*100):0;
  document.getElementById('globalBarFill').style.width = pct+'%';
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(!currentCat){
    grid.innerHTML = `<div class="emptyState">No folders left. Create one using the "+ Folder" box in the sidebar.</div>`;
    return;
  }
  const list = DATA[currentCat] || [];
  if(list.length===0){
    grid.innerHTML = `<div class="emptyState">No parts added yet for <b>${currentCat}</b>.<br>
      Click <b>+ Add Part</b> above, or browse
      <a href="https://inmoov.fr/inmoov-stl-parts-viewer/?bodyparts=${encodeURIComponent(currentCat)}" target="_blank" style="color:#5b8cff">this category on inmoov.fr</a>
      and copy the part name / image URL in.</div>`;
    return;
  }
  list.forEach((p, idx)=>{
    const card = document.createElement('div');
    card.className = 'card' + (p.printed ? ' printed':'');
    card.innerHTML = `
      <div class="thumb">
        ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div class=\\'noimg\\'>No preview available</div>'">` : `<div class="noimg">No image set</div>`}
      </div>
      <div class="cardBody">
        <div class="name" title="${p.name}">${p.name}</div>
        <textarea class="desc" data-idx="${idx}" placeholder="Description...">${p.desc||''}</textarea>
        <div class="cardFooter">
          <label class="printedLabel">
            <input type="checkbox" data-idx="${idx}" class="printedChk" ${p.printed?'checked':''}>
            Printed
          </label>
          <div class="cardActions">
            <button data-idx="${idx}" class="editBtn">Edit</button>
            <button data-idx="${idx}" class="danger delBtn">Delete</button>
          </div>
        </div>
      </div>`;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.printedChk').forEach(chk=>{
    chk.onchange = e=>{
      const i = +e.target.dataset.idx;
      DATA[currentCat][i].printed = e.target.checked;
      renderAll();
    };
  });
  grid.querySelectorAll('.desc').forEach(ta=>{
    ta.oninput = e=>{
      const i = +e.target.dataset.idx;
      DATA[currentCat][i].desc = e.target.value;
    };
  });
  grid.querySelectorAll('.delBtn').forEach(btn=>{
    btn.onclick = e=>{
      const i = +e.target.dataset.idx;
      if(confirm(`Delete "${DATA[currentCat][i].name}"?`)){
        DATA[currentCat].splice(i,1);
        renderAll();
      }
    };
  });
  grid.querySelectorAll('.editBtn').forEach(btn=>{
    btn.onclick = e=>{
      const i = +e.target.dataset.idx;
      openModal(DATA[currentCat][i], i);
    };
  });
}

function renderAll(){
  renderSidebar(document.getElementById('search').value);
  renderTopbar();
  renderGlobalStats();
  renderGrid();
}

/* ---------- Folder create / delete ---------- */
function deleteFolder(cat){
  const {total} = catTotals(cat);
  const msg = total > 0
    ? `Delete the folder "${cat}" AND all ${total} part(s) inside it? This cannot be undone.`
    : `Delete the empty folder "${cat}"?`;
  if(!confirm(msg)) return;
  const idx = CATEGORY_NAMES.indexOf(cat);
  if(idx > -1) CATEGORY_NAMES.splice(idx,1);
  delete DATA[cat];
  if(currentCat === cat){
    currentCat = CATEGORY_NAMES[0] || null;
  }
  renderAll();
}

document.getElementById('deleteFolderBtn').onclick = ()=> deleteFolder(currentCat);

document.getElementById('newFolderBtn').onclick = ()=>{
  const input = document.getElementById('newFolderInput');
  const name = input.value.trim();
  if(!name) return;
  if(CATEGORY_NAMES.includes(name)){
    alert('A folder with that name already exists.');
    return;
  }
  CATEGORY_NAMES.push(name);
  DATA[name] = [];
  currentCat = name;
  input.value = '';
  renderAll();
};
document.getElementById('newFolderInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('newFolderBtn').click();
});

/* ---------- Modal ---------- */
const overlay = document.getElementById('modalOverlay');
function openModal(existing=null, idx=null){
  editingIndex = idx;
  document.getElementById('modalTitle').textContent = existing ? 'Edit Part' : `Add Part to ${currentCat}`;
  document.getElementById('mName').value = existing ? existing.name : '';
  document.getElementById('mImage').value = existing ? (existing.image||'') : '';
  document.getElementById('mDesc').value = existing ? (existing.desc||'') : '';
  overlay.classList.add('show');
  document.getElementById('mName').focus();
}
function closeModal(){ overlay.classList.remove('show'); editingIndex=null; }

document.getElementById('addPartBtn').onclick = ()=> openModal();
document.getElementById('mCancel').onclick = closeModal;
overlay.onclick = e=>{ if(e.target===overlay) closeModal(); };

document.getElementById('mSave').onclick = ()=>{
  const name = document.getElementById('mName').value.trim();
  if(!name){ alert('Please enter a part name.'); return; }
  const image = document.getElementById('mImage').value.trim();
  const desc = document.getElementById('mDesc').value.trim();
  if(editingIndex!==null){
    const p = DATA[currentCat][editingIndex];
    p.name=name; p.image=image; p.desc=desc;
  } else {
    DATA[currentCat].push({name, image, desc, printed:false});
  }
  closeModal();
  renderAll();
};

/* ---------- Search ---------- */
document.getElementById('search').oninput = e=> renderSidebar(e.target.value);

/* ---------- Export / Import ---------- */
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'inmoov-stl-progress.json';
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      // merge: keep known categories, add any unexpected ones too
      Object.keys(parsed).forEach(cat=>{
        if(!CATEGORY_NAMES.includes(cat)) CATEGORY_NAMES.push(cat);
        DATA[cat] = parsed[cat];
      });
      if(!DATA[currentCat]) currentCat = CATEGORY_NAMES[0];
      renderAll();
      alert('Progress imported successfully.');
    }catch(err){
      alert('Could not read that file — is it a valid export from this app?');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

/* ---------- Init ---------- */
renderAll();
</script>
